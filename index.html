<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق الشعلة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #f8f9fa; color: #333; min-height: 100vh; display: flex; flex-direction: column; }
    
    .header {
      background-color: #056839; color: #fff; padding: 20px 15px; text-align: center;
      border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
    }
    .header h1 { font-size: 24px; font-weight: bold; }
    .header p { font-size: 14px; margin-top: 6px; opacity: 0.9; }

    .loading-container {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top: 4px solid #056839;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .btn-retry {
      margin-top: 15px; padding: 10px 20px; background-color: #056839; color: white;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer; display: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>سوق الشعلة 🔥</h1>
    <p>— خضراوات طازجة لحد باب البيت —</p>
  </header>

  <main class="loading-container" id="loadingArea">
    <div class="spinner" id="spinner"></div>
    <div id="statusTitle" style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">جارٍ التحميل...</div>
    <p id="statusMessage" style="font-size: 14px; color: #666;">إذا بقيت هذه الرسالة، يرجى الترفيش أو تفعيل JavaScript.</p>
    <button class="btn-retry" id="retryBtn" onclick="location.reload()">إعادة المحاولة</button>
  </main>

  <script>
    // حماية ضد التعليق: إذا استغرق التحميل أكثر من 6 ثوانٍ يظهر زر إعادة المحاولة وتنبيه للمستخدم
    const timeout = setTimeout(() => {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('statusTitle').innerText = 'تعذر تحميل البيانات';
      document.getElementById('statusMessage').innerText = 'حدث خطأ أثناء الاتصال بالخادم، يرجى التأكد من الإنترنت أو المحاولة لاحقاً.';
      document.getElementById('retryBtn').style.display = 'inline-block';
    }, 6000);

    window.addEventListener('load', function() {
      // قم باستدعاء دالة جلب البيانات الخاصة بك هنا
      loadAppData();
    });

    function loadAppData() {
      try {
        // مثال: جلب البيانات بواسطة fetch
        /*
        fetch('./data.json')
          .then(response => {
            if (!response.ok) throw new Error('فشل جلب الملف');
            return response.json();
          })
          .then(data => {
            clearTimeout(timeout); // إلغاء التوقيت عند النجاح
            // هنا قم بإخفاء شاشة التحميل وإظهار محتوى التطبيق
            document.getElementById('loadingArea').style.display = 'none';
          })
          .catch(error => handleFetchError(error));
        */
      } catch (err) {
        console.error("Critical JS Error:", err);
      }
    }
  </script>
</body>
</html>
