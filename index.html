<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق الشعلة</title>
  <style>
    /* إعادة ضبط أساسية لضمان التطابق على كافة المتصفحات */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* الهيدر العلوي */
    .header {
      background-color: #056839;
      color: #ffffff;
      padding: 20px 15px;
      text-align: center;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      font-size: 14px;
      margin-top: 6px;
      opacity: 0.9;
    }

    /* حاوية شاشة التحميل */
    .loading-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    /* المؤشر المتحرك (Spinner) ليعمل حتى لو لم تكتمل عناصر جافا سكريبت */
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #056839;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-title {
      font-size: 22px;
      font-weight: bold;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .loading-subtext {
      font-size: 14px;
      color: #666;
      max-width: 300px;
      line-height: 1.6;
    }

    /* تحسين إمكانية الوصول في حالة إيقاف JavaScript */
    noscript .spinner {
      display: none;
    }
  </style>
</head>
<body>

  <!-- الهيدر العلوي -->
  <header class="header">
    <h1>سوق الشعلة 🔥</h1>
    <p>— خضراوات طازجة لحد باب البيت —</p>
  </header>

  <!-- شاشة التحميل -->
  <main class="loading-container" id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-title">جارٍ التحميل...</div>
    <p class="loading-subtext">
      إذا بقيت هذه الرسالة، يرجى الترفيش أو تفعيل JavaScript.
    </p>
  </main>

  <!-- كود التفاعل لجميع المتصفحات -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // الكود الذي يتم تنفيذه بعد تحميل العناصر الأساسية
      // يمكنك إخفاء شاشة التحميل هنا عندما تكتمل بياناتك:
      // document.getElementById('loadingScreen').style.display = 'none';
    });
  </script>

</body>
</html>
